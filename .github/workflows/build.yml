name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build, test and package (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use Homebrew's Qt build, which matches the runner's macOS SDK.
      # The official Qt 6.8.3 binaries still reference the removed AGL framework
      # on recent macOS runners.
      - name: Install Qt and ffmpeg
        run: brew install qtbase qtsvg ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - name: Configure
        run: |
          QT_BASE="$(brew --prefix qtbase)"
          QT_SVG="$(brew --prefix qtsvg)"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_BASE" \
            -DQt6Svg_DIR="$QT_SVG/lib/cmake/Qt6Svg"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Produces a self-contained QEncoder.app / QEncoder.dmg with an
      # Applications shortcut for drag-and-drop installation.
      - name: Package app and DMG
        run: cmake --build build --target deploy_macos

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: QEncoder-macOS
          path: build/QEncoder.dmg
          if-no-files-found: error
          retention-days: 14
